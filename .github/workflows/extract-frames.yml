name: Extract cinematic frames

on:
  push:
    paths:
      - "frames-upload.zip"

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and extract the four frame sequences
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f frames-upload.zip ]; then
            echo "Archive is absent (likely the cleanup commit); nothing to extract."
            exit 0
          fi
          python - <<'PY'
          import json, zipfile
          archive = "frames-upload.zip"
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              manifest_name = "public/assets/frames/manifest.json"
              if manifest_name not in names:
                  raise SystemExit("Missing frame manifest")
              manifest = json.loads(z.read(manifest_name))
              expected = [300, 270, 270, 210]
              actual = [sum(1 for n in names if n.startswith(f"public/assets/frames/scene-{i:02d}/") and n.lower().endswith(".jpg")) for i in range(1, 5)]
              if manifest.get("total_frames") != 1050 or actual != expected:
                  raise SystemExit(f"Frame validation failed: manifest={manifest.get('total_frames')}, scenes={actual}")
              bad = [n for n in names if n.lower().endswith(".jpg") and not n.startswith("public/assets/frames/scene-")]
              if bad:
                  raise SystemExit(f"Unexpected JPG paths: {bad[:5]}")
              z.extractall(".")
          print("Validated and extracted 1,050 frames:", actual)
          PY
          rm frames-upload.zip
          test "$(find public/assets/frames -type f -name '*.jpg' | wc -l)" -eq 1050

      - name: Commit extracted frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/frames
          git rm --ignore-unmatch frames-upload.zip
          git commit -m "Add four cinematic frame sequences"
          git push
